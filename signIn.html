<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Entrar | HBO Max</title>
</head>

<body>
    <header class="header">
        <nav class="header__navbar">
            <img class="header__logo" src="./assets/images/hbo-logo.svg" alt="HBO Max logotipo">

            <div class="header__buttongroup">
                <a class="header__signin header__text--size-sm header__text--light header__text--bold header__text--uppercase header__text--decoration-none header__text--space" href="index.html">
                    Entrar
                </a>
                <a class="header__subscription header__text--size-sm header__text--light header__text--bold header__text--uppercase header__text--decoration-none header__text--space" href="#subscription">Assine agora</a>
            </div>
        </nav>
    </header>
    <main class="main">
        <form class="main__form main__form-border">
            <h1 class="form__title form__title--center">Entrar</h1>
            <p class="form__subtitle">Você tem uma conta da HBO Max?</p>
            <input class="form__input" type="email" placeholder="Endereço de e-mail">
            <input class="form__input" type="password" minlength="8" placeholder="Senha">
            <div class="form__submitblock">
                <button class="form__submitbutton" type="button">Entrar</button>
                <a class="form__link" href="#">Esqueceu a senha?</a>
            </div>
        </form>
    </main>
    <footer class="footer">
        <ul class="footer__nav footer__nav-column">
            <li class="footer__link">
                <a class="footer__anchor footer__anchor-uppercase footer__anchor-bold" href="#">Agora na hbo max</a>
            </li>
            <li class="footer__link">
                <a class="footer__anchor footer__anchor-uppercase footer__anchor-bold" href="#">Em breve</a>
            </li>
            <li class="footer__link">
                <a class="footer__anchor footer__anchor-uppercase footer__anchor-bold" href="#">Filme em destaque</a>
            </li>
            <li class="footer__link">
                <a class="footer__anchor footer__anchor-uppercase footer__anchor-bold" href="#">Séries</a>
            </li>
            <li class="footer__link">
                <a class="footer__anchor footer__anchor-uppercase footer__anchor-bold" href="#">Ajuda</a>
            </li>
            <li class="footer__link">
                <a class="footer__anchor footer__anchor-sm" href="#">&copy; 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.</a>
            </li>
        </ul>
        
        <section id="social-media">
            <ul class="footer__nav footer__nav-row">
                <li class="footer-link">
                    <a class="footer__anchor" href="#">
                        <img src="./assets/images/fb_0.png" alt="Link para ir a página do Facebook da HBOMax">
                    </a>
                </li>
                <li class="footer-link">
                    <a class="footer__anchor" href="#">
                        <img src="./assets/images/twitter_0.png" alt="Link para ir a página do Twitter da HBOMax">
                    </a>
                </li>
                <li class="footer-link">
                    <a class="footer__anchor" href="#">
                        <img src="./assets/images/instagram_0.png" alt="Link para ir a página do Instagram da HBOMax">
                    </a>
                </li>
                <li class="footer-link">
                    <a class="footer__anchor" href="#">
                        <img src="./assets/images/youtube_0.png" alt="Link para ir a página do YouTube da HBOMax">
                    </a>
                </li>
            </ul>
        </section>
    </footer>
</body>

</html>
