<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Entrar | HBO Max</title>
</head>

<body>
    <header class="header">
        <nav class="header__navbar">
            <img class="header__logo" src="./assets/images/hbo-logo.svg" alt="HBO Max logotipo">

            <div class="header__button-group">
                <a class="header__signin header__text--size-sm header__text--light header__text--bold header__text--uppercase header__text--decoration-none header__text--space" href="index.html">
                    Entrar
                </a>
                <a class="header__subscription header__text--light header__text--bold header__text--uppercase header__text--decoration-none header__text--space" href="#subscription">Assine agora</a>
            </div>
        </nav>
    </header>
    <main class="main">
        <form class="main__form main__form-border">
            <h1 class="main__title main__title--center">Entrar</h1>
            <p class="main__subtitle">Você tem uma conta da HBO Max?</p>
            <input class="main__input" type="email" placeholder="Endereço de e-mail">
            <input class="main__input" type="password" minlength="8" placeholder="Senha">
            <div class="main__form__submit-block">
                <button class="main__submit-button" type="submit">Entrar</button>
                <a class="main__link" href="#">Esqueceu a senha?</a>
            </div>
            
        </form>
    </main>
</body>

</html>
